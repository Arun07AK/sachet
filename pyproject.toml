[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sachet"
version = "0.1.0"
description = "Sachet: an AI agent that checks Indian job and internship offers against live search data before you pay or share documents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Arun AK" }]
dependencies = [
  "serpapi-search-tools>=1.0.0",
  "serpapi>=0.1.5",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sachet = "sachet.cli:main"
sachet-mcp = "sachet.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sachet = ["static/*", "examples/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
